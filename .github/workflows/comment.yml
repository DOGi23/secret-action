name: Add comment
on:
  issues:
    types: [opened]
jobs:
  add-comment:
    if: github.event.issue.body == 'Hello'
    runs-on: ubuntu-latest
    steps:
      - name: Add comment
        run: gh issue comment "$NUMBER" --body "$GREETING"
        env:
          GH_TOKEN: "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"
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          GREETING: "Hello to you too! :sparkles::sparkles::sparkles:"
